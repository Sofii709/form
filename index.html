<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <section class="wrapper form">
            <h1>Форми</h1>
            <div class="flex-between container">
                <div class="form_one">
                    <h2>01. проста форма</h2>
                    <label for=""><input type="text" placeholder="Введіть ім’я"></label> <br>
                    <label class="email" for=""><input type="text" placeholder="Email"></label> <br>
                    <select name="city">
                        <option value="" selected disabled>Ваше місто</option>
                        <option value="">Хмельницький</option>
                        <option value="">Львів</option>
                        <option value="">Київ</option>
                        <option value="">Луцьк</option>
                    </select> <br>
                        <textarea name="" placeholder="Email"></textarea> <br>
                        <button type="submit">Зареєструватися</button>
                </div>
                <div class="fixed_form">
                    <h2>06. фіксована форма</h2>
                </div>
            </div>
        </section>
    </header>
    <main>
        <section class="formtwo form wrapper">
            <h2>02. елементи</h2>
            <div class="flex-between">
                <div class="checkboxes flex-between">
                    <div>
                        <label for=""><input type="radio" name="check" id="">Нова Пошта</label>
                        <label for=""><input type="radio" name="check" id="">Кур’єр</label>
                        <label for="" class="disabled"><input type="radio" name="check" id="" disabled>Самовивіз</label>
                    </div>
                    <div class="checkbox">
                        <label><input type="checkbox" name="">Прочитав умови договору</label>
                        <label><input type="checkbox" name="">Згідний з ПДВ 9%</label>
                        <label class="disabled"><input type="checkbox" name="" disabled>Отримувати новини на ел. пошту</label>
                    </div>
                </div>
                <div class="checkboxestwo">
                    <div class="column items-center">
                    <p>Статус</p>
                        <label class="pad"><input type="checkbox" name="">Новинки</label>
                        <label><input type="checkbox" name="">Акційні товари</label>
                        <label><input type="checkbox" name="">Розпродаж</label>
                    </div>
                    <div class="column items-center">
                        <p>Дата</p>
                        <label class="date" for=""><input type="date" name="" id=""></label>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <footer></footer>
</body>
</html>
