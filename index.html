<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <section class="wrapper form">
            <h1>Форми</h1>
            <div class="flex-between container">
                <div class="form_one">
                    <h2>01. проста форма</h2>
                    <label for=""><input type="text" placeholder="Введіть ім’я"></label> <br>
                    <label class="email" for=""><input type="text" placeholder="Email"></label> <br>
                    <select name="city">
                        <option value="" selected disabled>Ваше місто</option>
                        <option value="">Хмельницький</option>
                        <option value="">Львів</option>
                        <option value="">Київ</option>
                        <option value="">Луцьк</option>
                    </select> <br>
                        <textarea name="" placeholder="Email"></textarea> <br>
                        <button type="submit">Зареєструватися</button>
                </div>
                <div class="fixed_form">
                    <h2>06. фіксована форма</h2>
                </div>
            </div>
        </section>
    </header>
    <main>
        <section class="formtwo form wrapper">
            <h2>02. елементи</h2>
            <div class="flex-between items-center">
                <div class="checkboxes flex-between">
                    <div>
                        <label for=""><input type="radio" name="check" id="">Нова Пошта</label>
                        <label for=""><input type="radio" name="check" id="">Кур’єр</label>
                        <label for="" class="disabled"><input type="radio" name="check" id="" disabled>Самовивіз</label>
                    </div>
                    <div class="checkbox">
                        <label><input type="checkbox" name="">Прочитав умови договору</label>
                        <label><input type="checkbox" name="">Згідний з ПДВ 9%</label>
                        <label class="disabled"><input type="checkbox" name="" disabled>Отримувати новини на ел. пошту</label>
                    </div>
                </div>
                <div class="checkboxestwo">
                    <div class="column items-center">
                    <p>Статус</p>
                        <label class="pad"><input type="checkbox" name="">Новинки</label>
                        <label><input type="checkbox" name="">Акційні товари</label>
                        <label><input type="checkbox" name="">Розпродаж</label>
                    </div>
                    <div class="column items-center">
                        <p>Дата</p>
                        <label class="date" for=""><input type="date" name="" id=""></label>
                    </div>
                </div>
            </div>
        </section>
        <div class="wrapper">
            <hr>
        </div>
        <section class="thirdform wrapper">
            <h2>03. стилізовані чекбокси </h2>
            <div class="flex items-center">
                <div class="gender">
                    <p><label class="man items-center" for=""><input type="radio" name="gender" id="man">Чоловік</label></p>
                    <p><label class="woman items-center" for=""><input type="radio" name="gender" id="woman">Жінка</label></p>
                </div>
                <div class="style">
                    <p><label class="items-center"><input type="checkbox" name=""><span></span></label>Отримувати новини</p>
                    <p><label class="items-center"><input type="checkbox" name=""><span></span></label>Купити додому ковбаси</p>
                    <p><label class="items-center"><input type="checkbox" name=""><span></span></label>Включити світло</p>
                </div>
            </div>
            <hr>
        </section>
        <section class="wrapper fourthform">
            <h2>04. форма таблицею</h2>
            <p>Заповніть усі необхідні поля</p>
            <table>
                <tbody>
                    <tr>
                        <td>ФІО:</td>
                        <td><label for=""><input type="text" name="" id="" placeholder="Введіть ім’я"></label></td>
                    </tr>
                    <tr>
                        <td>Пароль:</td>
                        <td><label for=""><input type="password" name="" id="" placeholder="Введіть не менше 6 символів"></label></td>
                    </tr>
                    <tr>
                        <td>Місто:</td>
                        <td><select name="city">
                        <option value="" selected>Хмельницький</option>
                        <option value="">Львів</option>
                        <option value="">Київ</option>
                        <option value="">Луцьк</option>
                    </select></td>
                    </tr>
                    <tr>
                        <td>Стать:</td>
                        <td class="column"><label><input type="radio" name="gend">Чоловік</label>
                            <label><input type="radio" name="gend">Жінка</label></td>
                    </tr>
                    <tr>
                        <td>Фото:</td>
                        <td></td>
                    </tr>
                    <tr>
                        <td>Коментарій:</td>
                        <td></td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
    <footer></footer>
</body>
</html>
